[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultralytics-striped"
version = "0.1.0"
description = "Pure PyTorch YOLO11 (no Ultralytics runtime dependency)"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pillow",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
yolo11-infer = "infer:main"
yolo11-convert-pt = "scripts.convert_ultralytics_weights:main"

[tool.setuptools]
py-modules = ["infer", "train"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "scripts*", "dataloader*", "utils*"]
